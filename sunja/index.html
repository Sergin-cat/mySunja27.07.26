<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Dmitro Kichen - web-designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
   <header class="hero">
    <div class="container">
        <div class="hero-header">
            <img src="./img/logo.svg" alt="logo- glo" class="logo">
            <div class="social-links">
                <a href="http://github.com" class="social-link"><img src="./img/social/github.svg" alt="github"></a>
                <a href="http://twitter.com" class="social-link"><img src="./img/social/twitter.svg" alt="twitter"></a>
                <a href="http://instagram.com" class="social-link"><img src="./img/social/instagram.svg" alt="instagram"></a>
                <a href="http://facebook.com" class="social-link"><img src="./img/social/facebook.svg" alt="facebook"></a>
            </div>
            <!-- /.social-links -->
        </div>
        <!-- /.hero-header -->

        <div class="hero-content">
            <div class="hero-text">
                <span class="hero-subtitle">Домохозяйка</span>
                <h1 class="hero-title">Оксана Копач</h1>
                <p class="hero-description">Разрабатываю сайты для малого и среднего бизнеса. У меня можно заказать дизайн и верстку небольшого сайта или интернет-магазина</p>
                <button class="button hero-button">Бесплатная консультация</button>
            </div>
            <div class="hero-avatar">

            </div>
        </div>

        </div>
        <!-- /.container -->
   </header>
